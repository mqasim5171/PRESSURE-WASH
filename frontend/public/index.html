  <!-- Pre-hydration title only. description/canonical/og:*/twitter:*/geo.*
       used to be hardcoded here too, but react-helmet-async only knows how
       to manage tags IT rendered - it has no way to find or remove tags
       that were already sitting in the raw HTML before React mounted. The
       net effect was two of every meta/link tag stacking up (this file's
       static one plus Meta.jsx's per-page one), with whichever one a given
       consumer happens to read first - browser, bot, or a Playwright
       querySelector - winning arbitrarily. Since this is a single index.html
       shared by every route, a "fallback" baked in here can only ever be
       accurate for one page anyway (the homepage) and actively wrong for
       every other route to a crawler that doesn't execute JS. Dropping
       them is the correct trade-off: no tag at all until Meta.jsx renders
       the real one, rather than a guaranteed-wrong one. Real crawlers that
       matter for indexing (Googlebot) execute JS and see Meta.jsx's tags
       correctly; the ones that don't (most social-preview bots) simply
       won't get a rich preview - an existing, disclosed limitation of this
       being a client-rendered SPA without server rendering, not something
       this fixes by itself. -->
  <title>Drone-Powered Solar Cleaning & Pressure Washing Sydney | Horizon Solar & Exterior Care</title>
